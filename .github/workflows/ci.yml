name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Python: syntax & import check ─────────────────────────────────────────
  python-lint:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          pip install pyflakes

      - name: Run pyflakes on all Python files
        run: |
          python -m pyflakes api/main.py api/models.py api/schemas.py

      - name: Compile-check all Python files
        run: |
          python -m py_compile api/main.py
          python -m py_compile api/models.py
          python -m py_compile api/schemas.py
          echo "All Python files compile cleanly."

  # ── TypeScript SDK: build + test ──────────────────────────────────────────
  sdk:
    name: SDK — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Run SDK tests
        working-directory: sdk
        run: npm test

  # ── React playground: build ────────────────────────────────────────────────
  playground:
    name: Playground — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: playground/package-lock.json

      - name: Install playground dependencies
        working-directory: playground
        run: npm ci

      - name: Build playground
        working-directory: playground
        run: npm run build
